name: tando

# Les ports hôte sont surchargeables via .env (substitution docker compose) pour
# cohabiter avec d'autres stacks locales. Défauts inchangés. Si tu changes un
# port ici, ajuste l'URL correspondante dans .env :
#   POSTGRES_HOST_PORT      -> DATABASE_URL
#   REDIS_HOST_PORT         -> REDIS_URL
#   MINIO_HOST_PORT         -> S3_ENDPOINT
#   MAILPIT_SMTP_HOST_PORT  -> SMTP_PORT

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tando
      POSTGRES_PASSWORD: tando
      POSTGRES_DB: tando
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tando"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tando
      MINIO_ROOT_PASSWORD: tando-secret
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Crée le bucket au démarrage, puis s'arrête.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tando tando-secret &&
      mc mb --ignore-existing local/tando-documents &&
      echo 'bucket prêt'
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_UI_HOST_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  postgres_data:
  redis_data:
  minio_data:

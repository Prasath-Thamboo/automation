name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Suffisant pour `prisma generate` et le build ; aucun accès réseau à une vraie base.
      DATABASE_URL: postgresql://tando:tando@localhost:5432/tando?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-0000000000000000000000000000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Build de prévisualisation EAS pour le mobile : à ajouter au Lot 7
  # (nécessite EXPO_TOKEN et un compte Expo).

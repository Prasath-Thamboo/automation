name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Suffisant pour `prisma generate` et le build ; aucun accès réseau à une vraie base.
      DATABASE_URL: postgresql://tando:tando@localhost:5432/tando?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-0000000000000000000000000000
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Env de test
        run: |
          cp .env.example .env
          sed -i 's#^SESSION_SECRET=.*#SESSION_SECRET=ci-session-secret-0000000000000000000000000000#' .env
          sed -i 's#^PUSH_ENABLED=.*#PUSH_ENABLED=false#' .env
          sed -i 's#^RATE_LIMIT_DISABLED=.*#RATE_LIMIT_DISABLED=true#' .env

      - name: Services (postgres, redis, minio, mailpit)
        run: docker compose up -d postgres redis minio minio-init mailpit

      - name: Migrations + seed
        run: |
          pnpm db:migrate:deploy
          pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Navigateurs Playwright
        run: pnpm --filter @tando/e2e exec playwright install --with-deps chromium

      - name: Tests end-to-end
        run: pnpm --filter @tando/e2e test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7


# §5 / §6bis — mettre l'employé virtuel en pause puis le remettre au travail,
# depuis « Mon équipe ». Prérequis : un employé virtuel déjà au travail.
appId: fr.velekya.app
tags:
  - equipe
---
- runFlow: ../common/login.yaml
- tapOn:
    id: "onglet-equipe"

- runFlow:
    when:
      visible:
        id: "btn-pause"
    commands:
      - tapOn:
          id: "btn-pause"
          index: 0
      - assertVisible:
          id: "btn-reprendre"
      - assertVisible:
          text: "État : en pause"
      # On le remet au travail (état d'origine)
      - tapOn:
          id: "btn-reprendre"
          index: 0
      - assertVisible:
          id: "btn-pause"
      - assertVisible:
          text: "État : au travail"

- runFlow:
    when:
      notVisible:
        id: "btn-pause"
    commands:
      - assertVisible:
          id: "onglet-equipe"

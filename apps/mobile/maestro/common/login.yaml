# Sous-parcours réutilisable : connexion par lien magique (canal mobile).
# Laisse l'app sur l'onglet « Aujourd'hui ».
appId: fr.tando.app
---
- runScript: ../scripts/magic-token.js
- launchApp:
    clearState: true
- assertVisible: "Recevoir mon lien de connexion"
- tapOn:
    id: "champ-email"
- inputText: ${MAESTRO_TEST_EMAIL}
- hideKeyboard
- tapOn: "Recevoir mon lien de connexion"
- assertVisible: "C'est envoyé."
# Le lien magique arrive par email ; on ouvre le deep link directement.
- openLink: "tando://verifier?token=${output.magicToken}"
- assertVisible: "Aujourd'hui"
